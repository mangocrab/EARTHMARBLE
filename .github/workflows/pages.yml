name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      EARTH_TEST_TURN_EXTERNAL: "true"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Check preinstalled Chrome
        run: '"$CHROMIUM_PATH" --version'
      - name: Start test TURN relay
        run: bash tests/fixtures/turn-container.sh start
      - run: npm run test:peer
      - run: npm run test:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Wait for Pages artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 15; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId
              });
              if (data.artifacts.some(a => a.name === 'github-pages' && !a.expired)) return;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            core.setFailed('Pages artifact metadata is not yet available.');
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Stop test TURN relay
        if: always()
        run: bash tests/fixtures/turn-container.sh stop
