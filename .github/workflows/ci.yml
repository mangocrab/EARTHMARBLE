name: Verify Earth Marble
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      EARTH_TEST_TURN_EXTERNAL: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check preinstalled Chrome
        run: '"$CHROMIUM_PATH" --version'
      - run: npm run test:e2e
      - run: npm run build:pages
      - name: Start test TURN relay
        run: bash tests/fixtures/turn-container.sh start
      - run: npm run test:peer
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
      - name: Stop test TURN relay
        if: always()
        run: bash tests/fixtures/turn-container.sh stop
